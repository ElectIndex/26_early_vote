[project]
name = "ev"
version = "0.1.0"
description = "ElectIndex 2026 early vote tracker — ingest pipeline and published data"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    # Georgia's Election Data Hub is a Qlik Cloud tenant, and the Qlik Engine
    # API is JSON-RPC over a WebSocket -- there is no REST route to the data.
    # `ga.py` imports this lazily inside fetch() so an environment without it
    # degrades to a SourceError on one state rather than an ImportError that
    # takes the whole run down. See docs/georgia-source.md §7.
    "websockets>=13,<16",
    "openpyxl>=3.1",
    # Iowa publishes its absentee request/return report only as a PDF -- there is
    # no CSV or XLSX of it anywhere on sos.iowa.gov. Text-layer extraction only.
    # ⚠️ UPPER-BOUNDED, AND THE BOUND IS LOAD-BEARING. pypdf's text extraction
    # changes its SPACING between releases on identical bytes: Montana's
    # dashboard title reads "2026 Montana Primary Election" under 6.16.1,
    # "2026 M o n tan a P rim ary E lectio n" under 6.18.0 and
    # "2 0 2 6  M o n ta n a" under 5.1.0. This was pinned `>=5.0`, CI resolved
    # 6.18.0, and mt.py's `\s+` title patterns stopped matching -- so mt-sos
    # raised SchemaDrift on TEN consecutive scheduled runs. It was invisible
    # because SchemaDrift falls THROUGH: Montana quietly handed itself to the
    # aggregator and reported `pending`, which reads as "early voting has not
    # opened" rather than "our scraper is broken".
    #
    # EIGHT adapters parse PDFs -- ak, de, hi, ia, la, mt, nv, or -- and every
    # one of them is exposed to the same drift. Raising this bound means
    # re-running all eight against real fixtures, not just letting the suite go
    # green on whatever pip resolved that morning.
    "pypdf>=5.0,<6.17",
    # Browser TLS/HTTP2 fingerprint. Several state hosts (ohiosos.gov,
    # azsos.gov) sit behind a Cloudflare rule that scores any Python client's
    # JA3 as automation and answers 403 -- to their homepages and archived files
    # alike, regardless of headers. _net.get retries a 403 through this; without
    # it those hosts stay unreachable but nothing breaks.
    "curl_cffi>=0.7",
    # California published its 2024 vote-by-mail workbook as legacy OLE2 .xls,
    # which openpyxl cannot open at all. xlrd 2.x reads .xls and ONLY .xls --
    # the mirror image of openpyxl -- so the two together cover every vintage
    # California has shipped. Without it CA silently loses a whole cycle to the
    # aggregator whenever the SoS reverts format.
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ev = "ev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
