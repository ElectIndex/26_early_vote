[project]
name = "ev"
version = "0.1.0"
description = "ElectIndex 2026 early vote tracker — ingest pipeline and published data"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "openpyxl>=3.1",
    # Iowa publishes its absentee request/return report only as a PDF -- there is
    # no CSV or XLSX of it anywhere on sos.iowa.gov. Text-layer extraction only.
    "pypdf>=5.0",
    # Browser TLS/HTTP2 fingerprint. Several state hosts (ohiosos.gov,
    # azsos.gov) sit behind a Cloudflare rule that scores any Python client's
    # JA3 as automation and answers 403 -- to their homepages and archived files
    # alike, regardless of headers. _net.get retries a 403 through this; without
    # it those hosts stay unreachable but nothing breaks.
    "curl_cffi>=0.7",
    # California published its 2024 vote-by-mail workbook as legacy OLE2 .xls,
    # which openpyxl cannot open at all. xlrd 2.x reads .xls and ONLY .xls --
    # the mirror image of openpyxl -- so the two together cover every vintage
    # California has shipped. Without it CA silently loses a whole cycle to the
    # aggregator whenever the SoS reverts format.
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ev = "ev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
