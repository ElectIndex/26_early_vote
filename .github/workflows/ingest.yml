name: ingest

# Every two hours, plus a button. The site reads output/*.csv straight off
# raw.githubusercontent.com, so this job IS the publish step -- there is nothing
# else to deploy.
#
# ⚠️ TWO HOURS IS NOT ABOUT FRESHNESS, IT IS ABOUT GITHUB'S SCHEDULER. Most
# states publish once a day; hourly would tell us nothing new about them. What a
# tighter cron buys is slack against a delay we have measured: on 2026-09-06 the
# three scheduled runs fired at 09:54, 14:38 and 19:46 for the 06:00, 12:00 and
# 18:00 slots -- late by 3.9, 2.6 and 1.8 hours -- and a fourth slot was skipped
# outright. Scheduled runs on shared runners are best-effort and always have
# been. At six-hour slots that pattern leaves ten-hour holes; at two-hour slots
# the delays overlap and something lands every few hours regardless.
#
# The floor is set by politeness, not by GitHub (whose documented minimum is 5
# minutes). Twelve slots a day is twelve hits per state source instead of four
# -- nothing for a public page -- and _net.py's 0.4s per-host throttle governs
# pacing WITHIN a run, which is where the one real ban we have taken came from.
# Going hourly would triple request volume for states that publish daily.
#
# A run that changes nothing commits nothing, so before October -- when every
# state answers NotYetPublished -- the extra slots cost an empty log line each.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

# Runs must never overlap. Two concurrent runs would each commit their own
# output/ and the second would land on a rebase conflict (or, worse, silently
# clobber the first). cancel-in-progress stays false: a queued run is fine, a
# half-finished one killed between its atomic write and its commit is not.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the push retry below rebases onto origin, and a
          # depth-1 clone cannot.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ingest
        # No --strict. Before October every state is `pending` (early voting has
        # not opened), which is the expected answer and not a failure -- a red
        # badge all September teaches everyone to ignore the badge in November.
        # The CLI already swallows a single adapter crash per state, so a
        # non-zero exit here means the run itself broke and should be loud.
        run: python -m ev ingest

      - name: Refresh the derived models
        # The page fetches output/party_estimate.csv and output/counterfactual.csv
        # live, and both are pure functions of the tables the step above just
        # rewrote. Until 2026-09-06 nothing re-derived them on a schedule, so the
        # modelled party registration and the 2024 estimate were only ever as
        # current as the last time somebody ran the command by hand -- stale by
        # construction, on a page whose whole point is that it is not.
        #
        # ⚠️ THIS DOES NOT WEAKEN THE RULE THAT `ev ingest` CANNOT PUBLISH A MODEL
        # NUMBER. That rule is about which command may write which columns, and it
        # is unchanged: these are separate commands, they write only their own
        # files, and `ingest` still never imports either module (cli.py defers the
        # import into the subcommand's dispatcher precisely so it cannot).
        #
        # Unfiltered on purpose -- no --state, no --cycle. Both writers replace
        # rather than merge on a full rebuild, and a filtered run would merge and
        # leave rows the model no longer produces sitting in the file forever.
        #
        # `|| true` is deliberately NOT here: a model that crashes should be loud.
        # A model with nothing to say is not a crash -- both commands exit 0 and
        # print a note when there is no like-for-like data, which is the normal
        # answer for most of the year.
        run: |
          set -euo pipefail
          python -m ev estimate
          python -m ev counterfactual

      - name: Commit published data
        run: |
          set -euo pipefail

          git config user.name  "electindex-bot"
          git config user.email "electindex-bot@users.noreply.github.com"

          # ONLY output/. Nothing else this job touched (the editable install
          # drops an egg-info, pip leaves caches) may ride along.
          git add -- output

          if git diff --cached --quiet; then
            echo "output/ unchanged -- nothing to commit."
            exit 0
          fi

          git commit -m "data: early vote $(date -u +%F)"

          # A human push or a queued sibling run can land between our fetch and
          # our push. Rebase and try once more before giving up.
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2; do
            if git pull --rebase --autostash origin "$branch" \
               && git push origin "HEAD:$branch"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed; retrying in 10s"
            sleep 10
          done

          echo "::error::could not push output/ after 2 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### Early vote ingest"
            echo
            if [ -f output/ev_status.json ]; then
              python - <<'PY'
          import json, pathlib
          s = json.loads(pathlib.Path("output/ev_status.json").read_text())
          summary = s.get("summary", {})
          print(f"`as_of` **{s.get('as_of')}** · "
                f"{s.get('days_to_election')} days to election")
          print()
          print(f"- ok: **{summary.get('ok', 0)}**")
          print(f"- pending: {summary.get('pending', 0)} (early voting not open yet)")
          print(f"- failed: {summary.get('failed', 0)}")
          bad = [k for k, v in s.get("states", {}).items()
                 if v.get("status") not in ("ok", "pending")]
          if bad:
              print()
              print("Every tier failed for: " + ", ".join(sorted(bad)))
          PY
            else
              echo "No \`output/ev_status.json\` was written."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
