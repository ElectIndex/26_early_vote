name: tests

on:
  push:
  pull_request:

# A new push supersedes the previous run on the same ref; there is no state to
# corrupt here, so cancelling is free.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >= 3.11, so the floor is tested too
        # -- the ingest job itself runs on 3.12.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Pytest
        # Adapter tests run against saved fixtures, never the live state sites,
        # so this is safe to run on every push.
        run: pytest -q
